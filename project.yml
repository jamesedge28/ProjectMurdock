name: ProjectMurdock
options:
  bundleIdPrefix: com.murdock
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

targets:
  ProjectMurdock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProjectMurdock/Sources
    info:
      path: ProjectMurdock/Info.plist
      properties:
        CFBundleDisplayName: "Project Murdock"
        CFBundleIdentifier: com.murdock.ProjectMurdock
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Requerido para radar óptico, LiDAR y lectura biométrica."
        NSMicrophoneUsageDescription: "Requerido para ecolocalización, sonar ultrasónico Doppler y zoom acústico."
        NSMotionUsageDescription: "Requerido para sismógrafo estructural y barómetro de intrusión."
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.murdock.ProjectMurdock
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        DEBUG_INFORMATION_FORMAT: dwarf
        TARGETED_DEVICE_FAMILY: "1"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ProjectMurdock/Sources/Shaders"
        MTL_HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ProjectMurdock/Sources/Shaders"
